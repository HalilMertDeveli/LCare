name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Backend (build + tests on real PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore services/api/LedCare.slnx
      - run: dotnet build services/api/LedCare.slnx --no-restore -c Release
      # Testcontainers starts a disposable postgres:17-alpine container (Docker is available on ubuntu runners).
      - run: dotnet test --project tests/backend/LedCare.Api.Tests --no-build -c Release
      - name: Fail if the model has changes without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project services/api/src/LedCare.Api --no-build --configuration Release
      - name: Docker image builds
        run: docker build -f services/api/Dockerfile -t ledcare-api:ci .

  web:
    name: Web (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile (analyze, tests, Android debug build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
