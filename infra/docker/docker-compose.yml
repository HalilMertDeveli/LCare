# LEDCare OS — local development stack.
# Usage (from repo root):
#   docker compose -f infra/docker/docker-compose.yml up -d postgres
#   docker compose -f infra/docker/docker-compose.yml --profile api up -d --build   # also runs the API in a container
#
# Values here are LOCAL DEVELOPMENT ONLY. Preview/production use managed secrets (see docs/development/setup.md).
name: ledcare

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LEDCARE_DB_NAME:-ledcare}
      POSTGRES_USER: ${LEDCARE_DB_USER:-ledcare}
      POSTGRES_PASSWORD: ${LEDCARE_DB_PASSWORD:-ledcare_dev_only}
    ports:
      - "127.0.0.1:${LEDCARE_DB_PORT:-5432}:5432"
    volumes:
      - ledcare-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["api"]
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${LEDCARE_DB_NAME:-ledcare};Username=${LEDCARE_DB_USER:-ledcare};Password=${LEDCARE_DB_PASSWORD:-ledcare_dev_only}"
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ledcare-pgdata:
